[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evalrun"
version = "0.4.1"
description = "Provider-agnostic evaluation and regression-testing toolkit for tool-using AI agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "python-frontmatter>=1.0.0",
    "PyYAML>=6.0",
    "langfuse>=2.0.0",
    "fastmcp>=0.1.0"
]

[project.scripts]
evalrun = "cli.main:main"

[tool.setuptools.packages.find]
# The repository contains runtime packages alongside scenario and output
# directories. Explicit discovery prevents setuptools from treating folders
# such as evals/, results/, and scratch/ as Python packages.
include = ["agents*", "cli*", "framework*", "ui*"]
exclude = ["tests*", "runs*", "evals*", "results*", "scratch*", "traces*", "dashboards*", "ground_truth*"]

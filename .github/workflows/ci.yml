name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]" pytest
      - name: Run tests
        env:
          EVALRUN_SKIP_NETWORK_CHECKS: "1"
        run: python -m pytest -m "not network"
      - name: Verify offline demo
        run: |
          evalrun demo --output /tmp/evalrun-demo
          test -f /tmp/evalrun-demo/report.html
